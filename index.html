
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Suzie Runner</title>
  <style>
    body { margin: 0; overflow: hidden; background: #aef; font-family: sans-serif; }
    canvas { display: block; background: #cceeff; }
    #scoreboard, #timer {
      position: absolute;
      font-size: 24px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.8);
      border-radius: 8px;
      color: #333;
    }
    #scoreboard { top: 10px; left: 10px; }
    #timer { top: 10px; right: 10px; }
    #overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      color: white; display: flex;
      justify-content: center; align-items: center;
      flex-direction: column; font-size: 32px;
    }
    #flyBtn {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      padding: 12px 24px;
      background: #ff69b4;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="scoreboard">Score: 0</div>
  <div id="timer">Time: 60</div>
  <div id="overlay"><div>Super Suzie Runner</div><button onclick="startGame()">Start Game</button></div>
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <button id="flyBtn">Fly</button>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreboard = document.getElementById("scoreboard");
    const overlay = document.getElementById("overlay");
    const timerDisplay = document.getElementById("timer");
    const gravity = 0.5;

    let score, startTime, gameEnded, coins, stars, flames, flameSchedule, player, gameStarted;

    const suzieImg = new Image();
    suzieImg.src = "assets/super-suzie-1.png";

    function resetGame() {
      score = 0;
      startTime = performance.now();
      gameEnded = false;
      gameStarted = true;
      coins = [];
      stars = [];
      flames = [];
      flameSchedule = [20, 27, 39, 42, 55];
      player = { x: 100, y: 300, width: 80, height: 80, dy: 0, step: 0 };
      overlay.style.display = "none";
      scoreboard.innerText = "Score: 0";
      timerDisplay.innerText = "Time: 60";
      loop();
    }

    function spawnCoin() {
      const y = Math.random() * 200 + 100;
      coins.push({ x: 800, y, collected: false });
    }

    function spawnStar() {
      if (Math.random() < 0.02) {
        stars.push({ x: 800, y: Math.random() * 200 + 50, collected: false });
      }
    }

    function drawGround() {
      ctx.fillStyle = "#88cc88";
      ctx.fillRect(0, 380, 800, 20);
    }

    function drawPlayer() {
      const legOffset = Math.sin(player.step / 5) * 3;
      ctx.drawImage(suzieImg, player.x, player.y + legOffset, player.width, player.height);
    }

    function drawCoins() {
      ctx.fillStyle = "gold";
      coins.forEach(c => {
        if (!c.collected) {
          ctx.beginPath(); ctx.arc(c.x, c.y, 10, 0, Math.PI * 2); ctx.fill();
        }
      });
    }

    function drawStars() {
      ctx.fillStyle = "purple";
      stars.forEach(s => {
        if (!s.collected) {
          ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, Math.PI * 2); ctx.fill();
        }
      });
    }

    function drawFlames() {
      ctx.fillStyle = "red";
      flames.forEach(f => {
        if (!f.collected) {
          ctx.beginPath(); ctx.arc(f.x, f.y, 10, 0, Math.PI * 2); ctx.fill();
        }
      });
    }

    let lastTime = performance.now();
    function loop(now = performance.now()) {
      const deltaTime = (now - lastTime) / 1000; lastTime = now;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGround();

      if (!gameEnded && gameStarted) {
        const elapsed = Math.floor((now - startTime) / 1000);
        timerDisplay.innerText = "Time: " + (60 - elapsed);

        if (flameSchedule.includes(elapsed)) {
          flames.push({ x: 800, y: Math.random() * 200 + 50, collected: false });
          flameSchedule = flameSchedule.filter(s => s !== elapsed);
        }

        if (now - startTime >= 60000) {
          gameEnded = true;
          overlay.innerHTML = `<div>Time's up! Final Score: ${score}</div><button onclick='startGame()'>Restart</button>`;
          overlay.style.display = "flex";
        }

        player.dy += gravity * deltaTime * 60;
        player.y += player.dy;

        if (player.y >= 300) { player.y = 300; player.dy = 0; }
        if (player.y < 0) { player.y = 0; player.dy = 0; }

        player.step++;

        coins.forEach(c => {
          c.x -= 240 * deltaTime;
          if (!c.collected && c.x < player.x + player.width && c.x + 10 > player.x &&
              c.y > player.y && c.y < player.y + player.height) {
            c.collected = true;
            score += 1;
            scoreboard.innerText = "Score: " + score;
          }
        });

        stars.forEach(s => {
          s.x -= 240 * deltaTime;
          if (!s.collected && s.x < player.x + player.width && s.x + 10 > player.x &&
              s.y > player.y && s.y < player.y + player.height) {
            s.collected = true;
            score += 5;
            scoreboard.innerText = "Score: " + score;
          }
        });

        flames.forEach(f => {
          f.x -= 240 * deltaTime;
          if (!f.collected && f.x < player.x + player.width && f.x + 10 > player.x &&
              f.y > player.y && f.y < player.y + player.height) {
            f.collected = true;
            score -= 25;
            if (score < 0) score = 0;
            scoreboard.innerText = "Score: " + score;
          }
        });

        if (Math.random() < 0.03) spawnCoin();
        spawnStar();
      }

      drawPlayer();
      drawCoins();
      drawStars();
      drawFlames();
      if (!gameEnded) requestAnimationFrame(loop);
    }

    function startGame() {
      resetGame();
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && gameStarted) {
        if (player.y >= 300) {
          player.dy = -10;
        } else {
          player.dy -= 4;
        }
      }
    });

    document.getElementById("flyBtn").addEventListener("click", () => {
      if (!gameStarted) return;
      if (player.y >= 300) {
        player.dy = -10;
      } else {
        player.dy -= 4;
      }
    });

    suzieImg.onload = () => {};
  </script>
</body>
</html>
